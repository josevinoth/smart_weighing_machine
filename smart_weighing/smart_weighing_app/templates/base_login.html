<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Weighing</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    {% load static %}
    <link href="{% static 'css/style.css' %}" rel="stylesheet">

    <!--    font style-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body >
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid position-relative">
        <div class="position-absolute start-0 d-flex align-items-center">
            {% if user.is_authenticated %}
            <span class="navbar-text ms-3">Welcome, {{ user.username }}</span>
            {% endif %}
        </div>

        <div class="mx-auto text-center">
            <span class="navbar-title">Smart Weighing</span>
        </div>
        <div class="position-absolute end-0 d-flex align-items-center">
            {% if request.user.is_authenticated %}
            <a class="btn btn-outline-light me-3" href="{% url 'logout' %}">Logout</a>
            {% endif %}
        </div>

    </div>
</nav>

<!-- Main content -->
<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap JS (Optional if you need) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
